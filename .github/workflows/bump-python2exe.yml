name: Bump python2exe formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump to (e.g., v0.1.1). If omitted, use latest release."
        required: false
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Determine version/tag
        id: ver
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh release view --repo planetminguez/Python2ExeInC --json tagName -q .tagName)
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download source and compute SHA256
        id: sha
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/planetminguez/Python2ExeInC/archive/refs/tags/${TAG}.tar.gz"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          curl -fsSL "$url" -o source.tgz
          sha256=$(sha256sum source.tgz | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update formula
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          URL: ${{ steps.sha.outputs.url }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          formula="Formula/python2exe.rb"
          # Replace url and sha256 lines
          sed -i "" -e "s#^\s*url \".*\"#  url \"$URL\"#" "$formula" || sed -i -e "s#^\s*url \".*\"#  url \"$URL\"#" "$formula"
          sed -i "" -e "s#^\s*sha256 \".*\"#  sha256 \"$SHA256\"#" "$formula" || sed -i -e "s#^\s*sha256 \".*\"#  sha256 \"$SHA256\"#" "$formula"

      - name: Commit and push
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/python2exe.rb
          git commit -m "python2exe ${VERSION}" || echo "No changes to commit"
          git push

